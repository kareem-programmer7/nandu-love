<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Nandu ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background"></div>

    <div class="stars"></div>


    <!-- =========================================
         FLOATING BACKGROUND HEARTS
    ========================================== -->

    <div class="floating-hearts">

        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>

    </div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="scene">


        <!-- =====================================
             LEFT MESSAGE
        ====================================== -->

        <section class="message">


            <div class="little-text">

                A LITTLE SOMETHING...

            </div>


            <h1>

                For

                <span>
                    Nandu
                </span>

            </h1>


            <div class="heart-title">

                ❤️

            </div>


            <div class="line"></div>


            <div
                id="typingText"
                class="typing-text"
            ></div>


            <div
                id="loveReveal"
                class="love-reveal"
            >

                <div class="love-line">

                    I Love You

                </div>


                <div class="nandu">

                    Nandu ❤️

                </div>


                <div class="pranam">

                    Nuvvu Na Pranam ❤️

                </div>

            </div>


            <div class="signature">

                — With Love, Always ❤️

            </div>


        </section>



        <!-- =====================================
             RIGHT HEART TREE
        ====================================== -->

        <section class="visual">


            <canvas
                id="heartCanvas"
            ></canvas>


            <!-- TRUNK -->

            <div class="trunk">

                <div class="trunk-light"></div>

            </div>


            <!-- GROUND -->

            <div class="ground"></div>


            <!-- FINAL HEART -->

            <div
                id="finalHeart"
                class="final-heart"
            >

                ❤️

            </div>


        </section>


    </main>



    <!-- =========================================
         BOTTOM TEXT
    ========================================== -->

    <div class="bottom-text">

        MADE WITH ❤️ JUST FOR NANDU

    </div>



    <!-- =========================================
         MUSIC BUTTON
    ========================================== -->

    <button
        id="musicBtn"
        class="music-btn"
        title="Play Music"
    >

        ♫

    </button>



    <!-- =========================================
         CLICK MESSAGE
    ========================================== -->

    <div
        id="clickMessage"
        class="click-message"
    >

        Tap anywhere on the heart ❤️

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
